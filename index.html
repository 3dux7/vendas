  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

g: 12px 20px; border-radius: 999px; font-weight: 700\">Quero o guia<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px 96px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center\">\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2E6A4C\">Guia digital · acesso imediato<\u002Fp>\n<h1 style=\"margin: 0; font-size: clamp(2.4rem, 5vw, 4rem); line-height: 1.05; letter-spacing: -0.035em; font-weight: 800\">Troque a ração por comida de verdade — sem medo de errar a dieta do seu pet.<\u002Fh1>\n<p style=\"margin: 0; font-size: 19px; line-height: 1.6; color: #4A5A50; max-width: 560px\">O passo a passo para montar, porcionar e fazer a transição para a alimentação natural de cães e gatos, com cardápios prontos, calculadora de porções e planilha de custos. Tudo pensado para você levar ao seu veterinário e decidir junto.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px; align-items: center\">\n<a href=\"#oferta\" style=\"text-decoration: none; background: {{accent}}; color: #FFFFFF; padding: 18px 30px; border-radius: 999px; font-weight: 700; font-size: 17px\">Quero começar a transição<\u002Fa>\n<a href=\"#conteudo\" style=\"text-decoration: none; color: #18241D; padding: 18px 8px; font-weight: 600; font-size: 16px\">Ver o que vem no guia →<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; color: #4A5A50; padding-top: 8px\">\n<span>✓ PDF + planilhas<\u002Fspan><span>✓ Cães e gatos<\u002Fspan><span>✓ Cozida ou crua (BARF)<\u002Fspan><span>✓ 7 dias de garantia<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0\">\n<div style=\"background: #18241D; color: #F5F2EA; border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #E8B65A\">Dentro do guia<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid #34443A; padding-bottom: 14px\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #E8B65A; font-size: 14px\">01<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Plano de transição de 21 dias<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid #34443A; padding-bottom: 14px\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #E8B65A; font-size: 14px\">02<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Calculadora de porções por peso e fase<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid #34443A; padding-bottom: 14px\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #E8B65A; font-size: 14px\">03<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Cardápios semanais prontos<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid #34443A; padding-bottom: 14px\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #E8B65A; font-size: 14px\">04<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Planilha: ração × natural no seu bolso<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid #34443A; padding-bottom: 14px\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #E8B65A; font-size: 14px\">05<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Dieta crua (BARF) com segurança<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: baseline\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #E8B65A; font-size: 14px\">06<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Roteiro para a consulta veterinária<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #ECE7DB\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 760px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2E6A4C\">Você se identifica?<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(1.9rem, 3.5vw, 2.75rem); line-height: 1.12; letter-spacing: -0.03em; font-weight: 800\">Você quer alimentar melhor seu pet, mas a internet só te deixou mais confuso.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px\">\n<div style=\"background: #F5F2EA; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">“Quanto eu dou?”<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Cada receita diz uma quantidade diferente e você não sabe qual vale para o peso e a idade do seu pet.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F2EA; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">“E se faltar nutriente?”<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Medo de montar uma dieta incompleta e prejudicar a saúde de quem você mais ama.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F2EA; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">“Vai sair muito caro?”<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Você não tem ideia de quanto gastaria por mês comparado à ração que compra hoje.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F2EA; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">“E se ele estranhar?”<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Trocar de uma vez pode causar desconforto digestivo — e ninguém te explicou como fazer aos poucos.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"conteudo\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 760px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2E6A4C\">A solução<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(1.9rem, 3.5vw, 2.75rem); line-height: 1.12; letter-spacing: -0.03em; font-weight: 800\">Um protocolo completo, do primeiro dia à rotina.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A50\">Cada material resolve uma das dúvidas acima. Você baixa, preenche com os dados do seu pet e segue.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px\">\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 1 · E-BOOK<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">Entendendo a alimentação natural<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">O que é, diferenças entre ração seca e ultraprocessados, alimentos proibidos para cães e gatos e os grupos que não podem faltar no prato.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 2 · PLANO<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">Transição em 21 dias<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Proporção ração/natural dia a dia, sinais para observar e o que fazer se o pet estranhar — com checklist imprimível.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 3 · FERRAMENTA<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">Calculadora de porções<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Planilha onde você informa espécie, peso, idade e nível de atividade e recebe a quantidade diária estimada para levar ao veterinário.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 4 · CARDÁPIOS<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">Receitas e lista de compras<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Cardápios semanais com lista de compras, modo de preparo, congelamento e porcionamento em marmitas.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 5 · FINANÇAS<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">Comparativo de custos<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Coloque os preços do seu mercado e da sua ração e veja, em reais, quanto custa cada opção por mês no seu caso.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 6 · DIETA CRUA<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">BARF com segurança<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Proporções para cães e gatos, receitas cruas prontas na calculadora, regras de higiene e em quais casos a dieta crua não é indicada.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">BÔNUS<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">Roteiro para o veterinário<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Perguntas certas para levar à consulta, para validar a dieta e pedir suplementação quando for necessária.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id  700\">O guia substitui o veterinário?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Não. O guia organiza o conhecimento e as ferramentas para você chegar à consulta preparado. A validação da dieta e de qualquer suplementação é sempre do médico-veterinário.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">Serve para gatos também?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Sim. Há seções e cardápios separados para cães e para gatos, que têm necessidades bem diferentes.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">Tem dieta crua (BARF)?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Sim. Há um módulo só sobre dieta crua, com receitas para cães e gatos, regras de higiene e os casos em que ela não é indicada. As receitas cruas também estão na calculadora.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">Preciso cozinhar todo dia?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Não. Os cardápios são pensados para preparo em lote: você cozinha uma ou duas vezes por semana e congela em porções.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">E se eu não gostar?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Você tem 7 dias para pedir o reembolso integral, sem precisar justificar.<\u002Fp><\u002F ace; color: #E8B65A; font-size: 14px\">04<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Planilha: ração × natural no seu bolso<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid #34443A; padding-bottom: 14px\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #E8B65A; font-size: 14px\">05<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Dieta crua (BARF) com segurança<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 16px; align-items: baseline\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #E8B65A; font-size: 14px\">06<\u002Fspan><span style=\"font-size: 17px; font-weight: 600\">Roteiro para a consulta veterinária<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background: #ECE7DB\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 760px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2E6A4C\">Você se identifica?<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(1.9rem, 3.5vw, 2.75rem); line-height: 1.12; letter-spacing: -0.03em; font-weight: 800\">Você quer alimentar melhor seu pet, mas a internet só te deixou mais confuso.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px\">\n<div style=\"background: #F5F2EA; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">“Quanto eu dou?”<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Cada receita diz uma quantidade diferente e você não sabe qual vale para o peso e a idade do seu pet.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F2EA; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">“E se faltar nutriente?”<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Medo de montar uma dieta incompleta e prejudicar a saúde de quem você mais ama.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F2EA; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">“Vai sair muito caro?”<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Você não tem ideia de quanto gastaria por mês comparado à ração que compra hoje.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F5F2EA; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 10px\"><h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">“E se ele estranhar?”<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Trocar de uma vez pode causar desconforto digestivo — e ninguém te explicou como fazer aos poucos.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"conteudo\" style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 760px\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2E6A4C\">A solução<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(1.9rem, 3.5vw, 2.75rem); line-height: 1.12; letter-spacing: -0.03em; font-weight: 800\">Um protocolo completo, do primeiro dia à rotina.<\u002Fh2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A50\">Cada material resolve uma das dúvidas acima. Você baixa, preenche com os dados do seu pet a levar ao veterinário.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 4 · CARDÁPIOS<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">Receitas e lista de compras<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Cardápios semanais com lista de compras, modo de preparo, congelamento e porcionamento em marmitas.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 5 · FINANÇAS<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">Comparativo de custos<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Coloque os preços do seu mercado e da sua ração e veja, em reais, quanto custa cada opção por mês no seu caso.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: flex; flex-direction: column; gap: 12px; background: #FFFFFF\">\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #2E6A4C; font-weight: 600\">MÓDULO 6 · DIETA CRUA<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em\">BARF com segurança<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Proporções para cães e gatos, receitas cruas prontas na calculadora, regras de higiene e em quais casos a dieta crua não é indicada.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 1px solid #DCD6C8; border-radius: 22px; padding: 32px; display: fle -weight: 800\">✓<\u002Fspan><span>Quem já tentou, mas parou por falta de método ou de tempo para cozinhar.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5\"><span style=\"color: #2E6A4C; font-weight: 800\">✓<\u002Fspan><span>Quem quer saber o custo real antes de decidir.<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; font-size: 17px; line-height: 1.5; color: #4A5A50\"><span style=\"font-weight: 800\">✕<\u002Fspan><span>Pets com doença diagnosticada, filhotes ou gestantes: a dieta deve ser formulada individualmente por um veterinário nutrólogo.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"oferta\" style=\"background: #ECE7DB\">\n<div style=\"max-width: 760px; margin: 0 auto; padding: 96px 24px\">\n<div style=\"background: #FFFFFF; border: 2px solid #2E6A4C; border-radius: 28px; padding: 44px 36px; display: flex; flex-direction: column; gap: 24px; align-items: center; text-align: center\">\n<p style=\"margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #2E6A4C\">NutriPet Protocol · acesso completo<\u002Fp>\n<h2 style=\"margin: 0; font-size: clamp(1.8rem, 3vw, 2.4rem); line-height: 1.15; letter-spacing: -0.03em; font-weight: 800\">Tudo o que você precisa para começar hoje<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 10px; text-align: left; font-size: 16px; line-height: 1.5; width: 100%; max-width: 440px\">\n<span>✓ E-book Entendendo a alimentação natural<\u002Fspan>\n<span>✓ Plano de transição de 21 dias + checklist<\u002Fspan>\n<span>✓ Calculadora de porções (planilha)<\u002Fspan>\n<span>✓ Cardápios semanais + listas de compras<\u002Fspan>\n<span>✓ Planilha comparativa de custos<\u002Fspan>\n<span>✓ Módulo de dieta crua (BARF) + receitas cruas<\u002Fspan>\n<span>✓ Bônus: roteiro para a consulta veterinária<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px; align-items: center\">\n<span style=\"font-size: 15px; color: #4A5A50\">De <s>R$ 89,90<\u002Fs> por<\u002Fspan>\n<span style=\"font-size: 52px; font-weight: 800; letter-spacing: -0.03em\">R$ 27,90<\u002Fspan>\n<span style=\"font-size: 15px; color: #4A5A50\">pagamento único · acesso vitalício<\u002Fspan>\n<\u002Fdiv>\n<a href=\"#\" style=\"text-decoration: none; background: #2E6A4C; color: #FFFFFF; padding: 20px 36px; border-radius: 999px; font-weight: 700; font-size: 18px; width: 100%; max-width: 440px; box-sizing: border-box\">Comprar e receber agora<\u002Fa>\n<p style=\"margin: 0; font-size: 14px; color: #4A5A50\">Pagamento seguro via Cakto · Pix ou cartão<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: center; padding-top: 40px\">\n<div style=\"width: 72px; height: 72px; border-radius: 50%; border: 2px solid #2E6A4C; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #2E6A4C; font-size: 20px\">7d<\u002Fdiv>\n<div style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 6px\">\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 700\">Garantia incondicional de 7 dias<\u002Fh3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Baixou, leu e achou que não é para você? Peça o reembolso em até 7 dias após a compra e devolvemos 100% do valor.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"faq\" style=\"max-width: 860px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; gap: 32px\">\n<h2 style=\"margin: 0; font-size: clamp(1.9rem, 3.5vw, 2.5rem); line-height: 1.12; letter-spacing: -0.03em; font-weight: 800\">Perguntas frequentes<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">Como recebo o material?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Por e-mail, logo após a confirmação do pagamento. São arquivos em PDF e planilhas que abrem no Excel ou no Google Planilhas, no celular ou no computador.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">O guia substitui o veterinário?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Não. O guia organiza o conhecimento e as ferramentas para você chegar à consulta preparado. A validação da dieta e de qualquer suplementação é sempre do médico-veterinário.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">Serve para gatos também?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Sim. Há seções e cardápios separados para cães e para gatos, que têm necessidades bem diferentes.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">Tem dieta crua (BARF)?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Sim. Há um módulo só sobre dieta crua, com receitas para cães e gatos, regras de higiene e os casos em que ela não é indicada. As receitas cruas também estão na calculadora.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">Preciso cozinhar todo dia?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Não. Os cardápios são pensados para preparo em lote: você cozinha uma ou duas vezes por semana e congela em porções.<\u002Fp><\u002Fdetails>\n<details style=\"border: 1px solid #DCD6C8; border-radius: 16px; padding: 22px 24px; background: #FFFFFF\"><summary style=\"font-size: 18px; font-weight: 700\">E se eu não gostar?<\u002Fsummary><p style=\"margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #4A5A50\">Você tem 7 dias para pedir o reembolso integral, sem precisar justificar.<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top: 1px solid #DCD6C8\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 36px 24px; display: flex; flex-direction: column; gap: 12px; font-size: 13px; line-height: 1.6; color: #4A5A50\">\n<p style=\"margin: 0\"><strong style=\"color: #18241D\">Aviso:<\u002Fstrong> este é um material educativo e não substitui a avaliação de um médico-veterinário. Antes de mudar a alimentação do seu pet, consulte um profissional.<\u002Fp>\n<p style=\"margin: 0\">© 2026 NutriPet Protocol · [SEU NOME OU EMPRESA] · [CNPJ] · <a href=\"#\">Termos de uso<\u002Fa> · <a href=\"#\">Política de privacidade<\u002Fa> · [E-MAIL DE CONTATO]<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2E6A4C&quot;,&quot;options&quot;:[&quot;#2E6A4C&quot;,&quot;#B4531F&quot;,&quot;#1F5A8A&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:5600}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { accent: this.props.accent ?? '#2E6A4C' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
